<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 관리</title>
</head>

<body>

<h1>도서 관리</h1>

<h2>도서 등록</h2>

<form th:action="@{/books}"
      th:object="${book}"
      method="post">

    <div>
        <label>책 제목</label>
        <input type="text"
               th:field="*{title}">
    </div>

    <div>
        <label>저자명</label>
        <input type="text"
               th:field="*{author}">
    </div>

    <div>
        <label>가격</label>
        <input type="number"
               th:field="*{price}">
    </div>

    <button type="submit">
        책 추가
    </button>

</form>


<hr>


<h2>전체 도서 목록</h2>

<table border="1">

    <thead>
    <tr>
        <th>제목</th>
        <th>저자</th>
        <th>가격</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="book : ${books}">

        <td th:text="${book.title}"></td>
        <td th:text="${book.author}"></td>
        <td th:text="${book.price}"></td>

    </tr>

    </tbody>

</table>

</body>
</html>
